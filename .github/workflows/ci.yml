name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: demo_app_test
      DB_USERNAME: laravel
      DB_PASSWORD: laravel_test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: demo_app_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: mbstring, pdo_mysql

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test

      - name: Seed Selenium test user
        run: php artisan db:seed --class=CiUserSeeder --force
        env:
          CI_TEST_EMAIL: ${{ secrets.CI_TEST_EMAIL }}
          CI_TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}

      - name: Install Chrome and matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install Selenium dependencies
        run: python -m pip install selenium openpyxl pillow

      - name: Start Laravel
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laravel.log
          exit 1

      - name: Run Selenium CRUD test
        run: python automation/test_crud.py
        env:
          CI: "true"
          TEST_EMAIL: ${{ secrets.CI_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Upload Selenium report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-crud-report
          path: automation/reports/
          if-no-files-found: warn
          retention-days: 14